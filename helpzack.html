<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>frankly</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f6f4ef;--ink:#1b1b1b;--line:#c9c5bb;--mute:#6c685f;--sb:#9a968b;--sh:#111;--kb:0px;--danger:#c0442b;--sans:'Satoshi',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111112;--ink:#f2f0ea;--line:#3f3f46;--mute:#94919b;--sb:#7b7882;--sh:#fff;--danger:#e87c62}}
:root[data-theme="dark"]{--bg:#111112;--ink:#f2f0ea;--line:#3f3f46;--mute:#94919b;--sb:#7b7882;--sh:#fff;--danger:#e87c62}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;overscroll-behavior-y:none}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
.scroll-line{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;pointer-events:none;overflow:hidden}
.scroll-line > span{display:block;height:100%;width:100%;background:var(--ink);opacity:.55;transform:scaleX(0);transform-origin:0 50%;will-change:transform}
@media (prefers-reduced-motion:reduce){.scroll-line > span{opacity:.4}}
@media print{ .scroll-line{display:none!important} }

#app{max-width:780px;margin:0 auto;padding:28px 24px calc(160px + var(--kb,0px));min-height:100vh;box-sizing:border-box;cursor:text}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font:300 12px/1 var(--mono);color:var(--mute);letter-spacing:.02em;cursor:default}
.wm-slot{position:relative;display:inline-block;font:400 28px/1 var(--sans);letter-spacing:-.02em}
.wm-spacer{visibility:hidden;display:block}
.wm{position:absolute;top:0;left:0;font:inherit;letter-spacing:inherit;color:var(--ink);transform-origin:top left;transition:transform .42s cubic-bezier(.22,1,.36,1);will-change:transform;pointer-events:none;white-space:nowrap}
.wm.wm-pinned{position:fixed;top:16px;left:16px;font-size:18px;padding:6px 12px;margin:-6px -12px;background:color-mix(in srgb, var(--bg) 85%, transparent);border-radius:9px;-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);z-index:20;pointer-events:auto;cursor:pointer}
.wm.wm-pinned:hover{background:color-mix(in srgb, var(--bg) 95%, transparent)}
@media (prefers-reduced-motion:reduce){.wm{transition:none}}
.header-utils{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ctl{font:inherit;color:inherit;background:none;border:0;padding:6px 0;margin-left:18px;cursor:pointer;transition:color .15s;touch-action:manipulation}
.ctl:hover{color:var(--ink)}

.menu-trigger{
  display:none;
  align-items:center;gap:7px;
  background:none;border:0;padding:6px 0;margin:0;
  font:400 10px/1 var(--mono);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--mute);
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  transition:color .15s;
}
.menu-trigger:hover,.menu-trigger:focus-visible{color:var(--ink);outline:none}
.menu-trigger:active{opacity:.7}
.menu-trigger .mt-chevron{display:block;transition:transform .3s ease}
.menu-trigger.pulse .mt-chevron{animation:mt-bob 2.4s ease-in-out infinite}
@keyframes mt-bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(2px)}
}
@media (prefers-reduced-motion:reduce){.menu-trigger.pulse .mt-chevron{animation:none}}

.cat-bar{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:0 0 26px;padding-bottom:14px;border-bottom:1px solid var(--line);
  font:400 11px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  cursor:default;
}
.cat-name{
  color:var(--mute);
  outline:none;cursor:text;
  min-width:4ch;
  padding:1px 3px;margin:-1px -3px;border-radius:4px;
  transition:color .15s,background .15s;
  letter-spacing:.1em;
}
.cat-name:hover{color:var(--ink)}
.cat-name:focus{color:var(--ink);background:color-mix(in srgb, var(--line) 40%, transparent);letter-spacing:.1em}
.cat-name:empty:before{content:'Untitled';color:var(--mute);opacity:.5}

.cat-hint{
  display:inline-flex;align-items:center;gap:10px;
  color:var(--mute);white-space:nowrap;flex:none;
  font-size:10px;letter-spacing:.14em;
}
.cat-hint .ch-text{opacity:.6}
.cat-hint kbd{
  font:inherit;padding:1px 5px;border:1px solid var(--line);border-radius:3px;
  background:transparent;color:inherit;
}
.cat-del{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;padding:0;margin:0;
  background:none;border:0;border-radius:4px;
  color:var(--mute);cursor:pointer;
  transition:color .15s,background .15s,opacity .15s;
  font:inherit;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.cat-del:hover{color:var(--danger);background:color-mix(in srgb, var(--line) 42%, transparent)}
.cat-del:focus-visible{outline:1.5px solid var(--mute);outline-offset:2px}
.cat-del.armed{color:var(--danger)}
.cat-del[hidden]{display:none}

.w{display:inline-block;white-space:nowrap}
.c{display:inline-block}
ul{list-style:none;margin:0;padding:0}
.top>li{margin-bottom:6px}
.kids{margin-left:12px;position:relative;--ind:28px}
.kids>li{position:relative;padding-left:var(--ind)}

.tree-lines{
  position:absolute;left:0;top:0;
  pointer-events:none;overflow:visible;
  user-select:none;
}
.tl-trunk,.tl-elbow{
  fill:none;
  stroke:var(--line);
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:stroke .15s;
}
.tree-lines.hot .tl-trunk,
.tree-lines.hot .tl-elbow{
  stroke:var(--sb);
}
.tl-hit{
  pointer-events:all;
  cursor:pointer;
}

.row{position:relative;min-height:44px;padding:4px 0 4px 24px;box-sizing:border-box;display:flex;align-items:center;font-size:var(--fs);line-height:1.25;cursor:text}
.row.ed{flex-direction:column;align-items:flex-start;justify-content:center}
.row.im{align-items:flex-start}
.pic{display:block;max-width:100%;max-height:min(60vh,480px);height:auto;object-fit:contain;border-radius:6px}
.frame{display:block;width:100%;max-width:100%;height:min(70vh,560px);border:1px solid var(--line);border-radius:6px;background:var(--bg);color-scheme:light dark}
.picwrap{position:relative;display:inline-block;max-width:100%}
.spk{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;opacity:0;transition:opacity .18s;cursor:pointer;touch-action:manipulation;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.picwrap:hover .spk,.spk:focus-visible{opacity:1}
.spk:focus-visible{outline:2px solid #fff;outline-offset:2px}
.spk svg{display:block}
.st{font-weight:400;white-space:pre-wrap;overflow-wrap:break-word;max-width:100%}
textarea{display:block;width:100%;max-width:100%;min-width:3ch;font:inherit;font-weight:400;line-height:inherit;color:inherit;caret-color:currentColor;background:transparent;border:0;outline:0;padding:0;margin:0;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word}
@supports (field-sizing:content){textarea{field-sizing:content;width:auto}}
textarea::placeholder{color:var(--mute);-webkit-text-fill-color:var(--mute)}
.row.g .st,.row.g textarea{background-image:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;caret-color:var(--cc)}
.row.s .st,.row.s textarea{background-image:var(--base-img);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;caret-color:var(--cc,var(--ink))}
.row.s .st{background-image:linear-gradient(120deg,transparent 35%,var(--sh) 50%,transparent 65%),var(--base-img);background-size:200% 100%,100% 100%;background-repeat:no-repeat;background-position:150% 0,0 0;animation:shine 3.2s linear infinite}
@keyframes shine{0%{background-position:150% 0,0 0}70%,100%{background-position:-50% 0,0 0}}
@media (prefers-reduced-motion:reduce){.row.s .st{animation:none}}

.tw{position:absolute;left:0;top:50%;transform:translateY(-50%);width:18px;height:28px;display:none;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer;color:var(--sb);touch-action:manipulation}
.row.has>.tw{display:flex}
.tw::before{content:'';display:block;width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .18s ease}
li:not(.z)>.row>.tw::before{transform:rotate(90deg)}
li.z>.row>.tw:hover::before{transform:rotate(90deg)}
li:not(.z)>.row>.tw:hover::before{transform:rotate(-90deg)}
.tw:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.tw::before{transition:none}}

.badge{margin-left:9px;flex:0 0 auto;font:400 10px/1 var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 7px;letter-spacing:.02em}
li.z>.row{opacity:.88}
li[role="treeitem"]{outline:none}
li[role="treeitem"]:focus{outline:none}
li[role="treeitem"]:focus-visible{outline:1.5px solid var(--mute);outline-offset:4px;border-radius:6px}
#menu .tx.on{color:var(--ink)}
.tools{display:flex;gap:12px;margin-top:2px;font:300 11px/1 var(--mono);color:var(--mute);opacity:.55;transition:opacity .2s;-webkit-text-fill-color:currentColor;flex-wrap:wrap}
.row:hover .tools,.tools:focus-within{opacity:1}
.tools button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px 2px;-webkit-text-fill-color:currentColor;touch-action:manipulation}
.tools button:hover{color:var(--ink)}
.tools i{font-style:normal;padding:2px 5px;border:1px solid var(--line);border-radius:4px;font-size:10px}
.tools.e button:nth-child(-n+2){opacity:.4}
.tools button:disabled{opacity:.26;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px) + var(--kb,0px));transform:translate(-50%,8px);z-index:8;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font:400 11px/1 var(--mono);color:var(--ink);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;left:0;right:0;bottom:0;text-align:center;font:300 11px/1.6 var(--mono);letter-spacing:.02em;color:var(--mute);padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px) + var(--kb,0px));pointer-events:none;z-index:6}
#blurB{position:fixed;left:0;right:0;bottom:0;height:calc(7rem + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5;isolation:isolate}
#hint b{font-weight:500;color:var(--ink);opacity:.75}
#menu{position:fixed;z-index:9;display:none;flex-direction:column;gap:10px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font:400 11px/1 var(--mono)}
#menu .mr{display:flex;gap:8px;flex-wrap:wrap;max-width:240px}
#menu .mr[hidden]{display:none}
#menu .mr.act{gap:14px;padding-bottom:8px;border-bottom:1px solid var(--line);max-width:none}
#menu button{width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);transition:transform .12s;touch-action:manipulation}
#menu .mr button:not(.tx){box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
#menu button:hover{transform:scale(1.15)}
#menu button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#menu .gs{width:34px;border-radius:11px}
#menu .f{justify-content:space-between}
#menu .tx{width:auto;height:auto;padding:2px 0;border-radius:0;background:none;color:var(--mute);font:inherit}
#menu .tx:hover{color:var(--ink);transform:none}
#menu .tx:disabled{opacity:.28;cursor:default;pointer-events:none}
#menu .tx.primary{color:var(--ink);font-weight:600}
#ghost{position:fixed;left:0;top:0;z-index:400;margin-top:-6px;pointer-events:none;white-space:nowrap;font:300 11px/1 var(--mono);letter-spacing:.02em;color:var(--mute);opacity:0;transition:opacity .2s ease;will-change:transform,opacity}
#treeToggle{
  position:fixed;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--bg);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--mute);
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-50%) scale(.82);
  transition:opacity .15s ease, transform .15s ease;
  z-index:55;
  box-shadow:0 2px 10px rgba(0,0,0,.14);
}
#treeToggle.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#treeToggle svg{display:block}

.pull-scrim{
  position:fixed;inset:0;z-index:129;
  background:color-mix(in srgb, var(--bg) 55%, transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);
  backdrop-filter:blur(16px) saturate(1.1);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease;
  display:none;
}
html.pull-enabled .pull-scrim{display:block}
.pull-scrim.on{pointer-events:auto}
.pull-drawer{
  position:fixed;left:0;right:0;top:0;z-index:130;
  height:0;
  background:transparent;
  overflow:hidden;
  will-change:transform;
  transform:translateY(0);
  display:none;
  flex-direction:column;
}
html.pull-enabled .pull-drawer{display:flex}

.pull-drawer .pull-handle{
  position:relative;
  flex:none;
  margin:10px auto 4px;
  width:38px;height:4px;
  border-radius:2px;
  background:var(--mute);
  opacity:.35;
  pointer-events:none;
}

.pull-drawer .wheel-host{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
}

.pull-actions{
  flex:none;
  padding:0 18px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid color-mix(in srgb, var(--line) 55%, transparent);
  background:transparent;
}
.pull-actions-label{
  font:400 10px/1 var(--mono);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--mute);
  opacity:.6;
  padding:12px 6px 4px;
}
.pull-action{
  all:unset;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:14px 8px;
  border-radius:9px;
  cursor:pointer;
  font:400 15px/1.15 var(--sans);
  color:var(--ink);
  letter-spacing:-.005em;
  transition:background .15s,color .15s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.pull-action:hover,.pull-action:focus-visible{
  background:color-mix(in srgb, var(--line) 38%, transparent);
  outline:none;
}
.pull-action:active{ background:color-mix(in srgb, var(--line) 48%, transparent) }
.pull-action + .pull-action{ border-top:1px solid color-mix(in srgb, var(--line) 45%, transparent) }
.pull-action .pa-label{ display:block; font-weight:400 }
.pull-action .pa-arrow{
  flex:none;
  color:var(--mute);
  opacity:.55;
  transition:transform .15s,opacity .15s;
}
.pull-action:hover .pa-arrow,.pull-action:focus-visible .pa-arrow{ opacity:.9; transform:translateX(2px) }

@media (prefers-reduced-motion:reduce){
  .pull-scrim{transition:none}
}

@media (hover:none),(pointer:coarse),(max-width:768px){
  .header-utils .ctl{ display:none }
  .menu-trigger{ display:inline-flex }

  .row{min-height:44px;padding-top:3px;padding-bottom:3px;padding-left:22px}
  .tools{opacity:1;gap:4px;margin-top:6px}
  .tools button{min-height:44px;padding:4px 10px;gap:7px}
  .tools i{font-size:11px;padding:3px 6px}
  #menu{padding:14px;gap:12px}
  #menu .mr{gap:10px;max-width:min(280px,80vw)}
  #menu button{width:36px;height:36px}
  #menu .gs{width:52px;border-radius:17px}
  #menu .tx{padding:10px 2px}
  .tw{width:20px;height:40px}
  .tw::before{border-left-width:5.5px;border-top-width:5px;border-bottom-width:5px}
  .spk{opacity:1;width:40px;height:40px}
  .cat-hint .ch-text{display:none}
  .cat-hint{gap:0}
  .cat-del{width:32px;height:32px;margin:-7px -6px}
  .cat-del svg{width:14px;height:14px}
  #treeToggle{display:none}

  .kids{margin-left:0;--ind:6px}
  .kids .kids{--ind:4px}
  .kids .kids .kids{--ind:2px}
  .kids .kids .kids .kids{--ind:1px}
  .kids .kids .kids .kids .kids,
  .kids .kids .kids .kids .kids .kids,
  .kids .kids .kids .kids .kids .kids .kids{--ind:0px}

  .kids>li{margin-bottom:2px}

  .kids .kids .kids .kids .tw{width:16px}
  .kids .kids .kids .kids .tw::before{
    border-left-width:4px;
    border-top-width:3.5px;
    border-bottom-width:3.5px;
  }
}

@media print{
  #hint,#blurB,#toast,#menu,#ghost,#treeToggle,.write-cursor-dot,.write-cursor-ellipse,.spk,.frame,header span:last-child,.cat-bar,.wheel-overlay,.pull-drawer,.pull-scrim,.menu-trigger{display:none!important}
  body{background:#fff;color:#000}
  #app{max-width:none;padding:0;min-height:0}
  .row{min-height:0;font-size:13pt!important}
  .tree-lines{display:none!important}
  li[role="treeitem"]{opacity:1!important}
  .badge{display:none}
  @page{margin:18mm}
}
body.custom-cursor-active,body.custom-cursor-active #app,body.custom-cursor-active .row,body.custom-cursor-active header{cursor:none}
.write-cursor-dot,.write-cursor-ellipse{position:fixed;top:0;left:0;z-index:500;pointer-events:none;transform:translate(-9999px,-9999px);opacity:0;transition:opacity .18s ease;will-change:transform,width,height}
.write-cursor-dot.visible,.write-cursor-ellipse.visible{opacity:1}
.write-cursor-dot{background:var(--ink)}
.write-cursor-ellipse{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--ink);border-radius:50%;opacity:0}
.write-cursor-ellipse.visible{opacity:.32}
body.custom-cursor-active textarea{cursor:none}
body.custom-cursor-active.write-native-cursor,body.custom-cursor-active.write-native-cursor #app,body.custom-cursor-active.write-native-cursor .row,body.custom-cursor-active.write-native-cursor header{cursor:auto}
.write-native-cursor .write-cursor-dot,.write-native-cursor .write-cursor-ellipse{opacity:0!important}
@media (hover:none),(pointer:coarse){.write-cursor-dot,.write-cursor-ellipse{display:none!important}}

.wheel-overlay{
  position:fixed;inset:0;z-index:120;
  display:none;
  background:color-mix(in srgb, var(--bg) 55%, transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);
  backdrop-filter:blur(16px) saturate(1.1);
  animation:wo-in .18s ease both;
}
.wheel-overlay.on{display:block}
@keyframes wo-in{from{opacity:0}to{opacity:1}}
.wheel-overlay .wheel-host{position:absolute;inset:0}
.wheel-hint{
  position:absolute;left:82px;bottom:44px;
  font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);opacity:.7;pointer-events:none;
}
@media(max-width:600px){ .wheel-hint{left:28px;bottom:24px} }
@media (prefers-reduced-motion:reduce){ .wheel-overlay{animation:none} }

.option-wheel{
  --ow-text-color:#a6a6a6;
  --ow-active-color:#ffffff;
  --ow-font-size:3rem;
  --ow-inset:80px;
  position:relative;width:100%;height:100%;overflow:hidden;
  cursor:grab;user-select:none;touch-action:none;outline:none;
}
.option-wheel--dragging{cursor:grabbing}
.option-wheel__item{
  position:absolute;top:50%;left:var(--ow-inset);
  white-space:nowrap;font-size:var(--ow-font-size);line-height:1;font-weight:200;
  transform-origin:left center;cursor:pointer;
  will-change:transform,opacity,filter;
  color:color-mix(in srgb, var(--ow-active-color) calc(var(--ow-p,0) * 100%), var(--ow-text-color));
}
.option-wheel__item--selected{font-weight:500}
</style>
</head>
<body>
<div class="scroll-line" id="scrollLine" aria-hidden="true"><span id="scrollFill"></span></div>
<div id="app">
  <header>
    <span class="wm-slot"><span class="wm-spacer" aria-hidden="true">frankly</span><span class="wm" id="wm">frankly</span></span>
    <span class="header-utils">

function seedFromExport(d){
  const conv = arr => (arr || []).map(x => ({
    id: nid(),
    t: typeof x.text === 'string' ? x.text : '',
    c: typeof x.color === 'string' ? x.color : null,
    s: x.shiny === true,
    z: x.collapsed === true,
    k: conv(x.children)
  }));
  return (d.categories || []).map(c => ({
    id: nid(),
    name: typeof c.name === 'string' ? c.name : 'Untitled',
    tree: conv(c.statements)
  }));
}

const seed = () => seedFromExport(SEED_DATA);

function ensureIds(a, seen){
  a.forEach(n => {
    if(typeof n.id !== 'string' || !n.id || seen.has(n.id)) n.id = nid();
    seen.add(n.id);
    n.c = typeof n.c === 'string' ? n.c : null;
    n.s = !!n.s;
    n.z = !!n.z;
    n.k = Array.isArray(n.k) ? n.k : [];
    ensureIds(n.k, seen);
  });
}
function ensureCategoryShapes(list){
  const seen = new Set();
  list.forEach(c => {
    if(typeof c.id !== 'string' || !c.id || seen.has(c.id)) c.id = nid();
    seen.add(c.id);
    c.name = typeof c.name === 'string' ? c.name : 'Untitled';
    c.tree = Array.isArray(c.tree) ? c.tree : [];
    ensureIds(c.tree, seen);
  });
}

const safeGet = k => { try { return localStorage.getItem(k) } catch(_) { return null } };

function readNew(raw){
  if(!raw) return null;
  try {
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.list) && d.list.length){
      return { current: (typeof d.current === 'number') ? d.current : 0, list: d.list };
    }
  } catch(_){}
  return null;
}
function readLegacyDoc(raw){
  if(!raw) return null;
  try {
    const d = JSON.parse(raw);
    const st = Array.isArray(d) ? d
             : (d && Array.isArray(d.doc)) ? d.doc
             : (d && Array.isArray(d.statements)) ? d.statements
             : null;
    return (st && st.length) ? st : null;
  } catch(_){ return null }
}

let bootedFromMigration = false;
let loaded = readNew(safeGet(K));

if(!loaded){
  let oldDoc = readLegacyDoc(safeGet(K_OLD));
  if(!oldDoc){
    for(const lk of K_LEGACY){
      oldDoc = readLegacyDoc(safeGet(lk));
      if(oldDoc) break;
    }
  }
  if(oldDoc){
    loaded = {
      current: 0,
      list: oldDoc.map(node => ({
        id: nid(),
        name: node.t || 'Untitled',
        tree: Array.isArray(node.k) ? node.k : []
      }))
    };
    bootedFromMigration = true;
  }
}

if(!loaded) loaded = { current: 0, list: seed() };

let categories = loaded.list;
let currentIndex = Math.min(Math.max(0, loaded.current|0), categories.length - 1);
ensureCategoryShapes(categories);
let root = categories[currentIndex].tree;

const toast = m => {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), 2200);
};

let wt = null, wpending = false;

function serialize(){
  return JSON.stringify({
    app: 'frankly',
    v: 2,
    current: currentIndex,
    list: categories
  });
}

function persistNow(){
  try {
    localStorage.setItem(K, serialize());
    return true;
  } catch(e) {
    toast('couldn’t save locally — export json to keep this');
    return false;
  }
}
function persist(){
  wpending = true;
  if(wt) return;
  wt = setTimeout(() => { wt = null; if(wpending){ wpending = false; persistNow() } }, 400);
}
function flushSave(){
  if(wt){ clearTimeout(wt); wt = null }
  if(wpending){ wpending = false; persistNow() }
}
addEventListener('pagehide', flushSave);
addEventListener('beforeunload', flushSave);
document.addEventListener('visibilitychange', () => { if(document.hidden) flushSave() });

let hist = [], hi = -1, lastT = 0, lastTyping = false;
let histDirty = false, histT = null;

const snap = () => serialize();

function commitHist(){
  if(histDirty){
    histDirty = false;
    if(histT){ clearTimeout(histT); histT = null }
    hist[hi] = snap();
  }
}

function save(typing){
  persist();
  const now = Date.now();
  if(typing && lastTyping && now - lastT < 900 && hi > 0){
    histDirty = true;
    lastT = now;
    if(histT) clearTimeout(histT);
    histT = setTimeout(() => {
      histT = null;
      if(histDirty){ histDirty = false; hist[hi] = snap() }
    }, 600);
    return;
  }
  commitHist();
  const j = snap();
  if(hist[hi] === j){ lastT = now; lastTyping = !!typing; return }
  hist = hist.slice(0, hi + 1);
  hist.push(j);
  hi++;
  if(hist.length > 300){ hist.shift(); hi-- }
  lastT = now;
  lastTyping = !!typing;
}

hist = [snap()]; hi = 0;
if(bootedFromMigration) persistNow();

function restore(j){
  const parsed = JSON.parse(j);
  categories = parsed.list;
  currentIndex = Math.min(Math.max(0, parsed.current|0), categories.length - 1);
  ensureCategoryShapes(categories);
  root = categories[currentIndex].tree;
  editing = null;
  pendingCaret = null;
  persist();
  render();
}
const undo = () => { commitHist(); if(hi > 0){ restore(hist[--hi]); toast('undone') } };
const redo = () => { commitHist(); if(hi < hist.length - 1){ restore(hist[++hi]); toast('redone') } };

addEventListener('keydown', e => {
  if(!(e.metaKey || e.ctrlKey) || e.altKey) return;
  const k = e.key.toLowerCase();

  else if(k === 'y'){ e.preventDefault(); redo() }

const liOf     = id => treeEl.querySelector('li[role="treeitem"][data-id="' + id + '"]');

function find(id, a = root, p = null){
  for(let i = 0; i < a.length; i++){
    if(a[i].id === id) return { n: a[i], a, i, p };
    const r = find(id, a[i].k, a[i]);
    if(r) return r;
  }
  return null;
}
const allNodes = (a = root, o = []) => { a.forEach(n => { o.push(n); allNodes(n.k, o) }); return o };
const visible  = (a = root, o = []) => { a.forEach(n => { o.push(n); if(!n.z) visible(n.k, o) }); return o };

const countDesc = k => k.reduce((s, n) => s + 1 + countDesc(n.k), 0);

let editing = null, rendering = false, groups = [];
let pendingCaret = null;

function splitNode(root){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while(tw.nextNode()) if(!tw.currentNode.parentElement.classList.contains('c')) nodes.push(tw.currentNode);
  nodes.forEach(t => {
    const f = document.createDocumentFragment();
    t.nodeValue.split(/(\s+)/).forEach(w => {
      if(!w) return;
      if(/^\s+$/.test(w)){ f.appendChild(document.createTextNode(w)); return }
      const sp = document.createElement('span'); sp.className = 'w';
      [...w].forEach(ch => { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; sp.appendChild(c) });
      f.appendChild(sp);
    });
    t.replaceWith(f);
  });
}

function collect(){
  groups = [];

  add($('ht'), 700);

function ensureSplit(g){
  if(g.c) return;
  splitNode(g.s);
  const cs = g.s.querySelectorAll('.c');
  g.c = cs.length ? [...cs] : [];
  for(const x of g.c){
    if(x._b === undefined) x._b = parseInt(getComputedStyle(x).fontWeight) || 400;

const IMG = /^(?:https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif|svg|bmp)(?:[?#]\S*)?|https?:\/\/(?:images\.unsplash\.com|i\.imgur\.com|pbs\.twimg\.com|images\.pexels\.com)\/\S+|data:image\/(?:png|jpe?g|gif|webp|avif);base64,[A-Za-z0-9+\/=]+)$/i;
const VID = /^(?:https?:\/\/\S+\.(?:mp4|webm|mov|m4v|ogv)(?:[?#]\S*)?|data:video\/(?:mp4|webm|ogg);base64,[A-Za-z0-9+\/=]+)$/i;
const URL_RE = /^https?:\/\/\S+$/i;
const isImg = t => IMG.test(t.trim());
const isVid = t => VID.test(t.trim());
const isUrl = t => URL_RE.test(t.trim());
const isFrame = t => isUrl(t) && !isImg(t) && !isVid(t);

const vio = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;

    treeEl.querySelectorAll('video').forEach(o => {
      if(o !== v && !o.paused) o.pause();

    const p = v.play(); if(p) p.catch(() => {});

    if(!v.paused) v.pause();

const HE_T = '<b>enter</b> next &nbsp;·&nbsp; <b>branch</b> below &nbsp;·&nbsp; <b>tab</b> indent &nbsp;·&nbsp; <b>esc</b> done';

function paint(n, row, li){
  row.classList.toggle('g', isG(n.c));
  row.classList.toggle('s', !!n.s);
  row.style.color = '';
  row.style.removeProperty('--grad');
  row.style.removeProperty('--base-img');
  row.style.removeProperty('--cc');
  li.style.removeProperty('--lc');
  if(n.c){
    if(isG(n.c)){ row.style.setProperty('--grad', n.c); row.style.setProperty('--cc', first(n.c)) }
    else row.style.color = n.c;
    li.style.setProperty('--lc', first(n.c));
  }
  if(n.s){
    const b = n.c || 'var(--sb)';
    row.style.setProperty('--base-img', isG(n.c) ? n.c : `linear-gradient(${b},${b})`);
    if(n.c && !isG(n.c)) row.style.setProperty('--cc', n.c);
  }
}

function buildNode(n, d){
  const li = document.createElement('li');

function key(e, n){

    e.preventDefault();
    if(e.shiftKey){ addChild(n); return }

    if(sel > 0 && sel < v.length && selEnd === sel){
      const tail = v.slice(sel).trimStart();
      n.t = v.slice(0, sel).trimEnd();
      const m = mk(tail);
      r.a.splice(r.i + 1, 0, m);
      editing = m.id;
      pendingCaret = { id: m.id, pos: 0 };
      const li = liOf(n.id);
      if(li && li.parentElement){
        const d = (parseInt(li.getAttribute('aria-level'), 10) || 1) - 1;
        const nli = buildNode(m, d);
        li.parentElement.insertBefore(nli, li.nextSibling);
        t.value = n.t;

        render();

    reorder(n, e.key === 'ArrowUp' ? -1 : 1, sel);
    return;

    e.preventDefault();
    remove(n.id);

    if(x) edit(x.id);
    return;

    focusRow(id);
  }

function navKey(e, n, li){

  const k = e.key;

/* ══════════════════════════════════════════════════════
   SVG tree lines + hover-collapse hot zone
═══════════════════════════════════════════════════════ */
const SVG_NS   = 'http://www.w3.org/2000/svg';
const TL_W     = 28;
const TL_TRUNK = 11;
const TL_R     = 8;
const TL_END   = 22;

function tlMetrics(ul){
  let w = parseFloat(getComputedStyle(ul).getPropertyValue('--ind'));
  if(!isFinite(w)) w = 28;
  if(w < 0) w = 0;
  const trunk = Math.max(1.2, w * 0.39);
  const rad   = Math.max(0.8, Math.min(w * 0.29, 8));
  const end   = Math.max(trunk + rad + 0.5, w * 0.78);
  return { w, trunk, rad, end };
}

function drawTreeLines(){
  treeEl.querySelectorAll('ul.kids').forEach(ul => {
    const old = ul.querySelector(':scope > svg.tree-lines');
    if(old) old.remove();

    const lis = [...ul.children].filter(el => el.tagName === 'LI');
    if(!lis.length) return;

    const parentLi = ul.closest('li');
    const parentId = parentLi ? parentLi.dataset.id : '';

    const M = tlMetrics(ul);

    const ulRect = ul.getBoundingClientRect();
    const items = [];
    for(const li of lis){
      const row = li.querySelector(':scope > .row');
      if(!row) continue;
      const anchor = row.querySelector('textarea') || row.querySelector('.st') || row;
      const ar = anchor.getBoundingClientRect();
      const y = (ar.top + ar.height / 2) - ulRect.top;
      const lc = li.style.getPropertyValue('--lc');
      items.push({ y, color: lc ? lc.trim() : '' });
    }
    if(!items.length) return;

    const h = Math.max(1, Math.round(ulRect.height));
    const parts = [];

    parts.push(`<rect class="tl-hit" x="0" y="0" width="${Math.max(M.w, M.end + 1)}" height="${h}" fill="none"/>`);

    if(items.length > 1){
      const y0 = (items[0].y - M.rad).toFixed(1);
      const y1 = (items[items.length - 1].y - M.rad).toFixed(1);
      parts.push(`<path class="tl-trunk" d="M ${M.trunk} ${y0} V ${y1}"/>`);
    }

    for(const it of items){
      const cy = it.y;
      const top = (cy - M.rad).toFixed(1);
      const bot = cy.toFixed(1);
      const d = `M ${M.trunk} ${top} A ${M.rad} ${M.rad} 0 0 0 ${(M.trunk + M.rad).toFixed(1)} ${bot} H ${M.end.toFixed(1)}`;
      const style = it.color ? ` style="stroke:${it.color}"` : '';
      parts.push(`<path class="tl-elbow"${style} d="${d}"/>`);
    }

    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'tree-lines');
    svg.setAttribute('width', Math.max(M.w, M.end + 1));
    svg.setAttribute('height', h);
    svg.setAttribute('aria-hidden', 'true');
    if(parentId) svg.setAttribute('data-parent', parentId);
    svg.dataset.trunk = M.trunk;
    svg.innerHTML = parts.join('');
    ul.insertBefore(svg, ul.firstChild);
  });
}

let tlRaf = null;

  if(tlRaf) return;

/* ══════════════════════════════════════════════════════
   Ghost cursor tooltip
═══════════════════════════════════════════════════════ */
const cur = { x: innerWidth / 2, y: innerHeight / 2 };
const m   = { x: cur.x, y: cur.y };
const ghost = $('ghost');
let moved = false, blocked = true, gOp = -1, running = !document.hidden, ghostKey = null;

document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if(running){ stillFrames = 0; lastMove = performance.now(); startGhostLoop(); }
});

addEventListener('mousemove', e => {

  moved = true;
  blocked = !!(e.target.closest && e.target.closest('.row,.tools,header,#menu,.cat-bar,.wheel-overlay,.tree-lines,.wm-pinned,.cat-del,.pull-drawer,.pull-scrim'));
  lastMove = performance.now();
  stillFrames = 0;
  startGhostLoop();
});

  const t = e.touches[0];
  cur.x = t.clientX; cur.y = t.clientY;
  lastMove = performance.now();
  stillFrames = 0;
  startGhostLoop();
}, { passive: true });

const GHOST_GUTTER = 'hold shift for menu';
const GHOST_WHITE  = 'say something new or say something else';
const GUTTER_PAD   = 6;
const EDGE_MARGIN  = 24;

function hintState(){
  if(!moved || blocked || editing || !fine.matches) return { a: 0, mode: null, anchor: null };
  const vw = innerWidth, vh = innerHeight;
  const tr = treeEl.getBoundingClientRect();

  if(cur.x < tr.left - GUTTER_PAD){
    const dTree = tr.left - cur.x - GUTTER_PAD;
    const dEdge = cur.x;
    const kTree = ss(Math.min(1, dTree / 32));
    const kEdge = ss(Math.min(1, (dEdge - 6) / 22));
    return { a: Math.min(kTree, kEdge), mode: 'gutter', anchor: 'left' };
  }

  if(cur.x > tr.right + GUTTER_PAD){
    const dTree = cur.x - tr.right - GUTTER_PAD;
    const dEdge = vw - cur.x;
    const kTree = ss(Math.min(1, dTree / 32));
    const kEdge = ss(Math.min(1, (dEdge - 6) / 22));
    return { a: Math.min(kTree, kEdge), mode: 'gutter', anchor: 'right' };
  }

  const edge = Math.min(cur.x, vw - cur.x, cur.y, vh - cur.y);
  const edgeK = ss(edge / 36);
  const dx = Math.max(tr.left - cur.x, cur.x - tr.right, 0);
  const colK = 1 - ss(dx / 90);
  return { a: edgeK * colK, mode: 'whitespace', anchor: null };
}

let ghostRafId = null;
let lastMove = performance.now();
let stillFrames = 0;

function startGhostLoop(){
  if(ghostRafId == null && running) ghostRafId = requestAnimationFrame(loop);
}

function loop(){
  ghostRafId = null;
  if(!running) return;

  m.x += (cur.x - m.x) / 12;
  m.y += (cur.y - m.y) / 12;

  const st = hintState();
  const go = Math.round(st.a * 100) / 100;
  if(go !== gOp){ gOp = go; ghost.style.opacity = go }

  if(st.mode){
    const key = st.mode + (st.anchor ? ':' + st.anchor : '');
    if(key !== ghostKey){
      ghostKey = key;
      ghost.textContent = st.mode === 'gutter' ? GHOST_GUTTER : GHOST_WHITE;
    }
  }

  if(go > 0){
    const w = ghost.offsetWidth;
    const h = ghost.offsetHeight;
    let x, y = cur.y;
    if(st.anchor === 'left'){ x = EDGE_MARGIN; }
    else if(st.anchor === 'right'){ x = innerWidth - w - EDGE_MARGIN; }
    else {
      x = cur.x + 28;
      if(x + w > innerWidth - 12) x = cur.x - 28 - w;
    }
    y = Math.max(16, Math.min(innerHeight - h - 12, y));
    ghost.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
  }

  for(const g of groups){
    const sr = g.s.getBoundingClientRect();
    if(!sr.width) continue;
    const on = !RM.matches && fine.matches &&
      cur.y >= sr.top - 8 && cur.y <= sr.bottom + 8 &&
      cur.x >= sr.left - 60 && cur.x <= sr.right + 60;
    if(!on && !g.c) continue;
    if(on && !g.c) ensureSplit(g);
    if(!g.c || !g.c.length) continue;
    const maxD = Math.max(70, Math.min(sr.width / 2, 200));
    for(const c of g.c){
      let tg = 0;
      if(on){
        const r = c.getBoundingClientRect();
        tg = Math.max(0, 1 - Math.hypot(m.x - (r.x + r.width / 2), m.y - (r.y + r.height / 2)) / maxD);
        tg = tg * tg * (3 - 2 * tg);
      }
      const p = c._t === undefined ? -1 : c._t;
      if(p === tg) continue;
      const n = p < 0 ? tg : (Math.abs(tg - p) < .004 ? tg : p + (tg - p) * .18);
      c._t = n;
      c.style.fontWeight = Math.round(c._b + (g.hi - c._b) * n);
    }
  }

  if(performance.now() - lastMove > 1600 && gOp === 0){
    stillFrames++;
    if(stillFrames > 25) return;
  } else {
    stillFrames = 0;
  }

  ghostRafId = requestAnimationFrame(loop);
}
startGhostLoop();

/* ─────────────── custom cursor ─────────────── */
(function initWriteCursor(){

  const LERP = 0.35;

      rng.selectNodeContents(st);

      const last = ls[ls.length - 1];

    const angleTarget = speed > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : ellAngle;

    ellSX += (1 + stretch - ellSX) * 0.22;
    ellSY += (1 - stretch * 0.45 - ellSY) * 0.22;
    ell.style.transform = 'translate(' + px + 'px,' + py + 'px) rotate(' + ellAngle + 'deg) scale(' + ellSX + ',' + ellSY + ')';

    if(mode === 'line' && lastEl && !lastEl.isConnected){
      mode = 'dot'; lastEl = null; snap = null;
    }

    if(mode === 'line' && lastEl){
      if(px !== lastPX || py !== lastPY){
        snap = snapToText(lastEl, px, py);
        lastPX = px; lastPY = py;
      }
      if(snap){
        tgt = { x: snap.x, y: snap.top, w: 2, h: snap.h, mt: 0, ml: -1, r: 1 };
      } else {
        const cs = getComputedStyle(lastEl);
        const lh = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.25;
        const r = lastEl.getBoundingClientRect();
        tgt = { x: Math.max(r.left, Math.min(px, r.right)), y: py - lh / 2, w: 2, h: lh, mt: 0, ml: -1, r: 1 };
      }
    } else {
      tgt = { x: px, y: py, w: 6, h: 6, mt: -3, ml: -3, r: 3 };
    }

    cur.x  += (tgt.x  - cur.x ) * LERP;
    cur.y  += (tgt.y  - cur.y ) * LERP;
    cur.w  += (tgt.w  - cur.w ) * LERP;
    cur.h  += (tgt.h  - cur.h ) * LERP;
    cur.mt += (tgt.mt - cur.mt) * LERP;
    cur.ml += (tgt.ml - cur.ml) * LERP;
    cur.r  += (tgt.r  - cur.r ) * LERP;

    dot.style.width        = cur.w.toFixed(2)  + 'px';
    dot.style.height       = cur.h.toFixed(2)  + 'px';
    dot.style.margin       = cur.mt.toFixed(2) + 'px 0 0 ' + cur.ml.toFixed(2) + 'px';
    dot.style.borderRadius = cur.r.toFixed(2)  + 'px';
    dot.style.transform    = 'translate(' + cur.x.toFixed(2) + 'px,' + cur.y.toFixed(2) + 'px)';

    const settled = Math.abs(tgt.x - cur.x) < 0.06 && Math.abs(tgt.y - cur.y) < 0.06 &&
                    Math.abs(tgt.w - cur.w) < 0.06 && Math.abs(tgt.h - cur.h) < 0.06;
    if(settled && performance.now() - cLastMove > 1500){ cRafId = null; return }

    cRafId = requestAnimationFrame(step);
  }

  const startLoop = () => { if(!cRafId && !document.hidden) cRafId = requestAnimationFrame(step) };
  const stopLoop  = () => { if(cRafId){ cancelAnimationFrame(cRafId); cRafId = null } };

  function hideAll(){
    dot.classList.remove('visible');
    ell.classList.remove('visible');
    document.body.classList.remove('write-native-cursor', 'custom-cursor-active');
    stopLoop();
  }

  function refreshCursor(el, x, y){
    if(!el){ hideAll(); return }
    if(el.nodeType !== 1) el = el.parentElement;
    if(!el){ hideAll(); return }

    const overNative = !!(el.closest && el.closest(NATIVE));

    document.body.classList.add('custom-cursor-active');
    setText(el);

    const isNative = mode === 'native' || overNative;
    document.body.classList.toggle('write-native-cursor', isNative);

    px = x; py = y;
    cLastMove = performance.now();

    dot.classList.toggle('visible', !isNative);
    ell.classList.toggle('visible', !isNative && mode === 'dot');

    if(isNative) stopLoop(); else startLoop();
  }

  window.addEventListener('cursorsync', () => {
    const el = document.elementFromPoint(px, py);
    if(el) refreshCursor(el, px, py);
  });

  window.addEventListener('mousemove', e => {
    if(!fine.matches) return;
    if(e.target.closest && e.target.closest('.wheel-overlay')){
      dot.classList.remove('visible'); ell.classList.remove('visible');
      document.body.classList.remove('custom-cursor-active');
      stopLoop();
      return;
    }
    refreshCursor(e.target, e.clientX, e.clientY);
  });

  document.addEventListener('mouseleave', hideAll);
  document.addEventListener('visibilitychange', () => { document.hidden ? stopLoop() : startLoop() });
})();

(function gradualBlur(){
  const box = $('blurB'), N = 5, S = 2, inc = 100 / N, r = x => Math.round(x * 10) / 10;
  for(let i = 1; i <= N; i++){
    let p = i / N; p = p * p * (3 - 2 * p);
    const bv = (Math.pow(2, p * 4) * 0.0625 * S).toFixed(3);
    let g = `transparent ${r(inc * i - inc)}%, black ${r(inc * i)}%`;
    if(r(inc * i + inc) <= 100)     g += `, black ${r(inc * i + inc)}%`;
    if(r(inc * i + inc * 2) <= 100) g += `, transparent ${r(inc * i + inc * 2)}%`;
    const d = document.createElement('div');
    d.style.cssText =
      `position:absolute;inset:0;` +
      `-webkit-mask-image:linear-gradient(to bottom,${g});mask-image:linear-gradient(to bottom,${g});` +
      `-webkit-backdrop-filter:blur(${bv}rem);backdrop-filter:blur(${bv}rem)`;
    box.appendChild(d);
  }
})();

(function initWmPin(){
  const wm = document.getElementById('wm');
  if(!wm) return;
  const PIN_AT = 40;
  const noMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let pinned = false, raf = null;

  function flip(mutate){
    if(noMotion.matches){ mutate(); return }
    const before = wm.getBoundingClientRect();
    mutate();
    const after = wm.getBoundingClientRect();
    const dx = before.left - after.left;
    const dy = before.top  - after.top;
    const sx = after.width  ? before.width  / after.width  : 1;
    const sy = after.height ? before.height / after.height : 1;
    if(!dx && !dy && sx === 1 && sy === 1) return;
    wm.style.transition = 'none';
    wm.style.transformOrigin = 'top left';
    wm.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
    void wm.offsetWidth;
    wm.style.transition = '';
    wm.style.transform = '';
  }

  function update(){
    raf = null;
    const y = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    const want = y > PIN_AT;
    if(want === pinned) return;
    flip(function(){
      pinned = want;
      wm.classList.toggle('wm-pinned', pinned);
    });
  }

  addEventListener('scroll', function(){
    if(!raf) raf = requestAnimationFrame(update);
  }, { passive: true });

  wm.addEventListener('click', function(){
    if(!pinned) return;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  update();
})();

function createOptionWheel(root, options){
  const REM_PX = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;

  const o = Object.assign({
    items: [],
    defaultSelected: 0,
    onChange: null,
    onSelect: null,
    textColor: '#a6a6a6',
    activeColor: '#ffffff',
    side: 'left',
    fontSize: 3,
    spacing: 1.4,
    curve: 1,
    tilt: 6,
    blur: 2,
    fade: 0.25,
    minOpacity: 0.05,
    smoothing: 200,
    inset: 80,
    loop: false,
    draggable: true,
    soundUrl: '',
    soundVolume: 0.5,
    className: ''
  }, options || {});

  const items = o.items;
  const cfg = {
    count: items.length,
    items: items,
    rowH: Math.max(o.fontSize * o.spacing * REM_PX, 1),
    curve: o.curve,
    tilt: o.tilt,
    blur: o.blur,
    fade: o.fade,
    minOpacity: o.minOpacity,
    side: o.side,
    loop: o.loop,
    smoothing: o.smoothing,
    draggable: o.draggable,
    soundUrl: o.soundUrl,
    soundVolume: o.soundVolume
  };

  root.classList.add('option-wheel');
  if (o.side === 'right') root.classList.add('option-wheel--right');
  if (o.className) o.className.split(/\s+/).filter(Boolean).forEach(c => root.classList.add(c));
  root.setAttribute('role', 'listbox');
  root.setAttribute('aria-label', 'Category wheel');
  root.tabIndex = 0;

  root.style.setProperty('--ow-text-color', o.textColor);
  root.style.setProperty('--ow-active-color', o.activeColor);
  root.style.setProperty('--ow-font-size', o.fontSize + 'rem');
  root.style.setProperty('--ow-inset', o.inset + 'px');

  const itemEls = items.map(function(label, index){
    const el = document.createElement('div');
    el.className = 'option-wheel__item';
    el.setAttribute('role', 'option');
    el.textContent = label;
    el.addEventListener('click', function(){ handleItemClick(index); });
    root.appendChild(el);
    return el;
  });

  let pos = clampIndex(o.defaultSelected);
  let target = pos;
  let selectedIndex = clampIndex(o.defaultSelected);
  let rafId = null;
  let last = 0;
  let wheelTimer = null;
  let drag = null;
  let dragMoved = false;
  let audio = null, audioUrl = '', lastTick = 0;

  function clampIndex(v){
    if (cfg.loop) return v;
    return Math.min(Math.max(v, 0), Math.max(cfg.count - 1, 0));
  }

  function runFrame(now){
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const tau = Math.max(cfg.smoothing, 1) / 1000;
    const k = 1 - Math.exp(-dt / tau);
    let next = pos + (target - pos) * k;
    const settled = Math.abs(target - next) < 0.001;
    if (settled) next = target;
    pos = next;

    const n = cfg.count;
    const mirror = cfg.side === 'right' ? -1 : 1;
    const tiltRad = (cfg.tilt * Math.PI) / 180;
    const R = tiltRad > 0.0005 ? cfg.rowH / tiltRad : 0;

    for (let i = 0; i < n; i++){
      const el = itemEls[i];
      if (!el) continue;
      let d = i - next;
      if (cfg.loop && n > 1){
        d = ((d % n) + n) % n;
        if (d > n / 2) d -= n;
      }
      const dist = Math.abs(d);
      let x = 0, y = d * cfg.rowH, rot = 0;
      if (R > 0){
        const ang = Math.max(-Math.PI/2, Math.min(Math.PI/2, d * tiltRad));
        y = R * Math.sin(ang);
        x = -mirror * R * (1 - Math.cos(ang)) * cfg.curve;
        rot = (mirror * ang * 180) / Math.PI;
      }
      el.style.transform =
        'translate(' + x.toFixed(2) + 'px, calc(' + y.toFixed(2) +
        'px - 50%)) rotate(' + rot.toFixed(3) + 'deg)';
      el.style.opacity = String(Math.max(cfg.minOpacity, 1 - dist * cfg.fade));
      el.style.filter = cfg.blur > 0 ? 'blur(' + (dist * cfg.blur).toFixed(2) + 'px)' : 'none';
      el.style.setProperty('--ow-p', Math.max(0, 1 - Math.min(dist, 1)).toFixed(4));
    }
    rafId = settled ? null : requestAnimationFrame(runFrame);
  }

  function startLoop(){
    if (rafId != null) cancelAnimationFrame(rafId);
    last = performance.now();
    rafId = requestAnimationFrame(runFrame);
  }

  function playTick(){
    const soundUrl = cfg.soundUrl, soundVolume = cfg.soundVolume;
    if (!soundUrl) return;
    const now = performance.now();
    if (now - lastTick < 70) return;
    lastTick = now;
    if (!audio || audioUrl !== soundUrl){
      audio = new Audio(soundUrl);
      audio.preload = 'auto';
      audioUrl = soundUrl;
    }
    audio.volume = Math.min(Math.max(soundVolume, 0), 1);
    audio.currentTime = 0;
    const p = audio.play();
    if (p && typeof p.catch === 'function') p.catch(function(){});
  }

  function updateSelection(){
    for (let i = 0; i < itemEls.length; i++){
      const on = i === selectedIndex;
      itemEls[i].classList.toggle('option-wheel__item--selected', on);
      itemEls[i].setAttribute('aria-selected', on ? 'true' : 'false');
    }
  }

  function applyTarget(value, snap){
    let v = value;
    if (!cfg.loop) v = Math.min(Math.max(v, 0), Math.max(cfg.count - 1, 0));
    if (snap) v = Math.round(v);
    target = v;
    const idx = ((Math.round(v) % cfg.count) + cfg.count) % cfg.count;
    if (idx !== selectedIndex){
      selectedIndex = idx;
      updateSelection();
      if (typeof o.onChange === 'function') o.onChange(idx, cfg.items[idx]);
      playTick();
    }
    startLoop();
  }

  function onWheel(e){
    e.preventDefault();
    const delta = e.deltaMode === 1 ? e.deltaY * 24 : e.deltaY;
    const step = Math.max(-1, Math.min(1, delta / cfg.rowH));
    applyTarget(target + step, false);
    if (wheelTimer) clearTimeout(wheelTimer);
    wheelTimer = setTimeout(function(){ applyTarget(target, true); }, 140);
  }
  root.addEventListener('wheel', onWheel, { passive: false });

  function onPointerDown(e){
    if (!cfg.draggable) return;
    drag = { y: e.clientY, start: target, id: e.pointerId };
    dragMoved = false;
    root.classList.add('option-wheel--dragging');
  }
  function onPointerMove(e){
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (!dragMoved && Math.abs(dy) > 4){
      dragMoved = true;
      if (root.setPointerCapture){ try { root.setPointerCapture(drag.id); } catch(err){} }
    }
    if (dragMoved) applyTarget(drag.start - dy / cfg.rowH, false);
  }
  function onPointerEnd(){
    if (!drag) return;
    drag = null;
    root.classList.remove('option-wheel--dragging');
    if (dragMoved) applyTarget(target, true);
  }
  root.addEventListener('pointerdown', onPointerDown);
  root.addEventListener('pointermove', onPointerMove);
  root.addEventListener('pointerup', onPointerEnd);
  root.addEventListener('pointercancel', onPointerEnd);

  function handleItemClick(index){
    if (dragMoved) return;
    const curIdx = target;
    let d = index - (((curIdx % cfg.count) + cfg.count) % cfg.count);
    if (cfg.loop && cfg.count > 1){
      if (d > cfg.count / 2) d -= cfg.count;
      else if (d < -cfg.count / 2) d += cfg.count;
    }
    applyTarget(curIdx + d, true);
    if (typeof o.onSelect === 'function') o.onSelect(index, cfg.items[index]);
  }

  function onKeyDown(e){
    let delta = null;
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') delta = -1;
    else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') delta = 1;
    if (delta == null) return;
    e.preventDefault();
    applyTarget(Math.round(target) + delta, true);
  }
  root.addEventListener('keydown', onKeyDown);

  updateSelection();
  applyTarget(target, false);

  return {
    select: function(index){ applyTarget(index, true); },
    get selected(){ return selectedIndex; },
    destroy: function(){
      if (rafId != null) cancelAnimationFrame(rafId);
      if (wheelTimer) clearTimeout(wheelTimer);
      if (audio) audio.pause();
      root.removeEventListener('wheel', onWheel);
      root.removeEventListener('keydown', onKeyDown);
      root.removeEventListener('pointerdown', onPointerDown);
      root.removeEventListener('pointermove', onPointerMove);
      root.removeEventListener('pointerup', onPointerEnd);
      root.removeEventListener('pointercancel', onPointerEnd);
      root.innerHTML = '';
      root.classList.remove('option-wheel', 'option-wheel--right', 'option-wheel--dragging');
      if (o.className) o.className.split(/\s+/).filter(Boolean).forEach(c => root.classList.remove(c));
      root.removeAttribute('role');
      root.removeAttribute('aria-label');
      root.removeAttribute('tabindex');
      root.style.removeProperty('--ow-text-color');
      root.style.removeProperty('--ow-active-color');
      root.style.removeProperty('--ow-font-size');
      root.style.removeProperty('--ow-inset');
    }
  };
}

(function initCategoryWheel(){
  const overlay = $('wheelOverlay');
  const host = $('wheelHost');
  if(!overlay || !host) return;

  const HOLD_MS = 180;
  let holdTimer = null;
  let wheel = null;
  let wheelOpen = false;
  let originalIdx = 0;

  function fontSizeRem(){
    const w = window.innerWidth;
    if(w < 520) return 2.1;
    if(w < 760) return 2.6;
    if(w < 1100) return 3.2;
    return 3.8;
  }
  function insetPx(){
    const w = window.innerWidth;
    if(w < 520) return 28;
    if(w < 760) return 44;
    return 82;
  }

  function openWheel(){
    if(wheelOpen) return;
    wheelOpen = true;
    originalIdx = currentIndex;

    const names = categories.map(c => c.name || 'Untitled');
    names.push('+ New category');

    overlay.classList.add('on');
    overlay.setAttribute('aria-hidden', 'false');

    wheel = createOptionWheel(host, {
      items: names,
      defaultSelected: currentIndex,
      textColor: 'var(--mute)',
      activeColor: 'var(--ink)',
      side: 'left',
      fontSize: fontSizeRem(),
      spacing: 1.35,
      curve: 1,
      tilt: 6.5,
      blur: 2,
      fade: 0.22,
      minOpacity: 0.06,
      smoothing: 200,
      inset: insetPx(),
      loop: false,
      draggable: true,
      onChange: function(idx){
        if(idx < categories.length && idx !== currentIndex){
          currentIndex = idx;
          root = categories[currentIndex].tree;
          render();
          save();
        }
      }
    });
  }

  function closeWheel(commit){
    if(!wheelOpen) return;
    wheelOpen = false;

    const picked = wheel ? wheel.selected : currentIndex;
    if(wheel){ wheel.destroy(); wheel = null; }

    overlay.classList.remove('on');
    overlay.setAttribute('aria-hidden', 'true');

    if(!commit){
      if(currentIndex !== originalIdx){
        currentIndex = originalIdx;
        root = categories[currentIndex].tree;
        render();
        save();
      }
      return;
    }

    if(picked >= categories.length){
      createNewCategory();
    }
  }

  function createNewCategory(){
    const cat = { id: nid(), name: '', tree: [mk()] };
    categories.push(cat);
    currentIndex = categories.length - 1;
    root = cat.tree;
    render();
    save();
    requestAnimationFrame(function(){
      catNameEl.focus();
      try {
        const rng = document.createRange();
        rng.selectNodeContents(catNameEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(rng);
      } catch(_){}
    });
    toast('new category — name it, then write');
  }

  addEventListener('keydown', function(e){
    if(e.key !== 'Shift'){
      if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
      return;
    }
    if(wheelOpen) return;
    if(holdTimer) return;
    const ae = document.activeElement;
    if(ae && (ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    holdTimer = setTimeout(function(){
      holdTimer = null;
      openWheel();
    }, HOLD_MS);
  }, true);

  addEventListener('keyup', function(e){
    if(e.key !== 'Shift') return;
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; return; }
    if(wheelOpen) closeWheel(true);
  }, true);

  addEventListener('keydown', function(e){
    if(e.key === 'Escape' && wheelOpen){ e.preventDefault(); closeWheel(false); }
  }, true);

  addEventListener('blur', function(){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    if(wheelOpen) closeWheel(false);
  });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && wheelOpen) closeWheel(false);
  });
})();

    if(open) return;
    if(animating) return;
    const overlayOn = $('wheelOverlay').classList.contains('on');
    if(overlayOn) return;
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    if(y > 0.5) return;
    const t = e.touches[0];
    if(!t) return;
    if(t.clientY > EDGE_ZONE) return;
    if(e.target.closest('.cat-bar,#menu,.wheel-overlay,button,a,input,textarea,.pull-drawer,.pull-scrim')) return;
    pulling = true;
    pStartY = t.clientY;
    pStartX = t.clientX;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if(!pulling) return;
    const t = e.touches[0];
    if(!t) return;
    const dy = t.clientY - pStartY;
    const dx = t.clientX - pStartX;

    if(dy < -6){ pulling = false; return; }
    if(Math.abs(dx) > Math.abs(dy) * 1.4 && dy < 30){ pulling = false; return; }

    if(dy > 0){
      try { e.preventDefault(); } catch(_){}
      drawerH = DRAWER_H();
      if(drawer.style.height !== drawerH + 'px') drawer.style.height = drawerH + 'px';
      const raw = dy / drawerH;
      const eased = 1 - Math.exp(-raw * SPRING);
      setProgress(eased);
    }
  }, { passive: false });

  function endPull(){
    if(!pulling) return;
    pulling = false;
    if(progress >= OPEN_THRESH){
      openDrawer();
      if(progress >= 1) return;
      easeTo(1);
    } else {
      easeTo(0, () => { drawer.style.height = ''; });
    }
  }

  document.addEventListener('touchend', endPull, { passive: true });
  document.addEventListener('touchcancel', endPull, { passive: true });

  scrim.addEventListener('click', () => {
    if(Date.now() < suppressClickUntil) return;
    if(open) closeDrawer();
  });

  drawer.querySelectorAll('.pull-action').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      const act = btn.dataset.act;

      if(act === 'import'){
        $('file').click();
        return;
      }

      if(act === 'export'){
        const ok = runExport();
        const lbl = btn.querySelector('.pa-label');
        const prev = lbl.textContent;
        lbl.textContent = ok;
        setTimeout(() => { lbl.textContent = prev }, 1800);
        closeDrawer();
        return;
      }

      if(act === 'reset'){
        if(btn.dataset.arm){
          clearTimeout(resetArmTimer);
          delete btn.dataset.arm;
          categories = seed();
          ensureCategoryShapes(categories);
          currentIndex = 0;
          root = categories[0].tree;
          editing = null;
          pendingCaret = null;
          render();
          save();
          btn.querySelector('.pa-label').textContent = 'reset demo';
          toast('reset demo');
          closeDrawer();
        } else {
          btn.dataset.arm = '1';
          btn.querySelector('.pa-label').textContent = 'sure? tap again';
          clearTimeout(resetArmTimer);
          resetArmTimer = setTimeout(() => {
            delete btn.dataset.arm;
            btn.querySelector('.pa-label').textContent = 'reset demo';
          }, 2800);
        }
        return;
      }

      if(act === 'theme'){
        const t = isDark() ? 'light' : 'dark';
        html.dataset.theme = t;
        try { localStorage.setItem(KT, t) } catch(e) {}
        paintTheme();
        return;
      }
    });
  });

  addEventListener('resize', () => {
    drawerH = DRAWER_H();
    if(!open && progress === 0) return;
    drawer.style.height = drawerH + 'px';
    if(open) setProgress(1);
    else setProgress(progress);
  });

  drawerH = DRAWER_H();
  setProgress(0);

  window.__pullDrawer = { open: openDrawer, close: closeDrawer };
})();

try { navigator.storage && navigator.storage.persist && navigator.storage.persist() } catch(e) {}

coarse.addEventListener('change', setHint);
render();
</script>
</body>
</html>
