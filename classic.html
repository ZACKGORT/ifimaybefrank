addEventListener('scroll',chk,{passive:true});chk();arm();
hud.querySelector('button').addEventListener('click',()=>{hudOff=true;hud.classList.remove('on');setTimeout(()=>{hud.hidden=true},300)});
const hh=hud.firstChild;let dg=null;
hh.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=hud.getBoundingClientRect();dg={x:e.clientX-r.left,y:e.clientY-r.top};hh.setPointerCapture(e.pointerId);hud.style.left=r.left+'px';hud.style.top=r.top+'px';hud.style.bottom=hud.style.right='auto'});
hh.addEventListener('pointermove',e=>{if(dg){hud.style.left=clamp(e.clientX-dg.x,0,innerWidth-hud.offsetWidth)+'px';hud.style.top=clamp(e.clientY-dg.y,0,innerHeight-hud.offsetHeight)+'px'}});
['pointerup','pointercancel'].forEach(n=>hh.addEventListener(n,()=>{dg=null}));
addEventListener('resize',()=>{if(hud.style.top){const r=hud.getBoundingClientRect();hud.style.left=clamp(r.left,0,innerWidth-r.width)+'px';hud.style.top=clamp(r.top,0,innerHeight-r.height)+'px'}});
/* HUD: Product / Ecommerce rows expand to their subsections (hover, focus, or when scrolled inside); current stop is marked */
const grps=[...hud.querySelectorAll('li.grp')],subs=[...hud.querySelectorAll('li.sub')];let curGrp='',hov='',pinned=false,cf=0;
const hSync=()=>{const open=new Set([curGrp,hov]);open.delete('');grps.forEach(g=>{const on=open.has(g.dataset.k);g.classList.toggle('op',on);g.setAttribute('aria-expanded',on)});subs.forEach(x=>{x.hidden=!open.has(x.dataset.g)})};
const hPin=()=>{if(pinned||hud.style.left)return;const r=hud.getBoundingClientRect();hud.style.top=r.top+'px';hud.style.bottom='auto';pinned=true};
const hClamp=()=>{if(!pinned&&!hud.style.left)return;const r=hud.getBoundingClientRect(),o=r.bottom-(innerHeight-8);if(o>0)hud.style.top=Math.max(8,r.top-o)+'px'};
const hUnpin=()=>{if(!pinned)return;pinned=false;hud.style.top='';hud.style.bottom=''};
const hGo=g=>{if(g===hov)return;hov=g;hPin();hSync();hClamp()};
const hOf=e=>{const li=e.target.closest&&e.target.closest('li');return li?(li.dataset.g||(li.classList.contains('grp')?li.dataset.k:'')):''};
const hOut=()=>{hov='';hSync();hUnpin()};
hud.addEventListener('pointerover',e=>hGo(hOf(e)));hud.addEventListener('focusin',e=>hGo(hOf(e)));
hud.addEventListener('pointerleave',hOut);hud.addEventListener('focusout',e=>{if(!hud.contains(e.relatedTarget))hOut()});
const cSync=()=>{let c=-1;STOPS.forEach((el,j)=>{if(yOf(el)<=scrollY+8)c=j});const id=c>=0?STOPS[c].id:'',st=id==='about-content'?'about':id;let g='';
hud.querySelectorAll('li[data-s]').forEach(li=>{const on=li.dataset.s===st;li.classList.toggle('cur',on);if(on)g=li.classList.contains('grp')?li.dataset.k:(li.dataset.g||'')});
if(g!==curGrp){curGrp=g;hSync();hClamp()}};
addEventListener('scroll',()=>{if(!hudOn||hudOff||cf)return;cf=requestAnimationFrame(()=>{cf=0;cSync()})},{passive:true});
function nudgeSpace(sticky){if(!hudOn||hudOff)return;[hot('Space'),scrolled&&hot('Shift+Space')].forEach(l=>{if(!l)return;l.classList.add('nudge');clearTimeout(l._n);if(!sticky)l._n=setTimeout(()=>l.classList.remove('nudge'),3200)})}
const hot=k=>[...hud.querySelectorAll('li')].find(l=>l.dataset.k===k),kn=e=>e.key===' '?(e.shiftKey?'Shift+Space':'Space'):e.key;
addEventListener('keydown',e=>{const l=hot(kn(e));if(!l)return;l.classList.add('hot');clearTimeout(l._t);l._t=setTimeout(()=>l.classList.remove('hot'),400)});
addEventListener('keyup',e=>{hud.querySelectorAll('.hot').forEach(l=>{if(l.dataset.k===kn(e)||e.key===' '){clearTimeout(l._t);setTimeout(()=>l.classList.remove('hot'),120)}})});
addEventListener('blur',()=>hud.querySelectorAll('.hot').forEach(l=>l.classList.remove('hot')));
showHud();nudgeSpace(true);
})();
</script>
<script>/* resume button: save the .docx (other origin, so fetch + blob) and show a live first-page preview on hover (docx-preview, loaded on first hover) */
(function(){var a=document.getElementById('rsm');if(!a)return;
var pv=document.createElement('div');pv.id='rsp';pv.setAttribute('aria-hidden','true');pv.innerHTML='<div class="rsd"></div><span class="rsl">loading preview\u2026</span>';document.body.appendChild(pv);
var bx=pv.firstChild,st='idle',tm=0,MIME='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
function src(u){return new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function lib(){if(window.docx&&docx.renderAsync)return Promise.resolve();
return(window.JSZip?Promise.resolve():src('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js')).then(function(){return src('https://unpkg.com/docx-preview@0.3.3/dist/docx-preview.min.js')})}
function fit(){var pg=bx.querySelector('section.docx');if(pg&&pg.offsetWidth&&bx.clientWidth)bx.style.setProperty('--s',bx.clientWidth/pg.offsetWidth)}
function load(){if(st!=='idle')return;st='load';
var doc=fetch(a.href+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.blob()});
Promise.all([doc,lib()]).then(function(r){return docx.renderAsync(r[0],bx,null,{inWrapper:true,ignoreWidth:false,breakPages:true})})
.then(function(){fit();st='ok';pv.classList.add('rdy')}).catch(function(){st='err'})}
function show(){clearTimeout(tm);load();tm=setTimeout(function(){if(st!=='err'){fit();pv.classList.add('on')}},140)}
function hide(){clearTimeout(tm);pv.classList.remove('on')}
addEventListener('resize',fit);
a.addEventListener('mouseenter',function(){if(matchMedia('(hover:hover)').matches)show()});
a.addEventListener('focus',function(){try{if(a.matches(':focus-visible'))show()}catch(_){}});
a.addEventListener('mouseleave',hide);a.addEventListener('blur',hide);
addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
a.addEventListener('click',function(e){hide();if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button)return;e.preventDefault();
fetch(a.href+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){var u=URL.createObjectURL(new Blob([b],{type:MIME})),d=document.createElement('a');d.href=u;d.download=a.getAttribute('download');document.body.appendChild(d);d.click();d.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}).catch(function(){window.open(a.href,'_blank','noopener')})})})();
</script>
