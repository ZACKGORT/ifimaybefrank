<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>frankly</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f6f4ef;--ink:#1b1b1b;--line:#c9c5bb;--mute:#8a867d;--sb:#9a968b;--sh:#111;--sans:'Satoshi',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111112;--ink:#f2f0ea;--line:#3f3f46;--mute:#77747b;--sb:#7b7882;--sh:#fff}}
:root[data-theme="dark"]{--bg:#111112;--ink:#f2f0ea;--line:#3f3f46;--mute:#77747b;--sb:#7b7882;--sh:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);transition:background .25s,color .25s}
#app{max-width:780px;margin:0 auto;padding:28px 24px 160px;min-height:100vh;box-sizing:border-box;cursor:text}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px;font:300 12px/1 var(--mono);color:var(--mute);letter-spacing:.02em;cursor:default}
header .wm{font:400 28px/1 var(--sans);letter-spacing:-.02em;color:var(--ink)}
.ctl{font:inherit;color:inherit;background:none;border:0;padding:6px 0;margin-left:18px;cursor:pointer;transition:color .15s}
.ctl:hover{color:var(--ink)}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block}
ul{list-style:none;margin:0;padding:0}
.top>li{margin-bottom:6px}
.kids{margin-left:12px}
.kids>li{position:relative;padding-left:28px}
.kids>li::before{content:'';position:absolute;left:0;top:0;width:22px;height:22px;border-left:1.5px solid var(--lc,var(--line));border-bottom:1.5px solid var(--lc,var(--line));border-bottom-left-radius:12px;box-sizing:border-box}
.kids>li:not(:last-child)::after{content:'';position:absolute;left:0;top:22px;bottom:0;border-left:1.5px solid var(--line)}
.row{min-height:44px;padding:4px 0;box-sizing:border-box;display:flex;align-items:center;font-size:var(--fs);line-height:1.25;cursor:text}
.row.ed{flex-direction:column;align-items:flex-start;justify-content:center}
.row.im{align-items:flex-start}
.pic{display:block;max-width:100%;max-height:min(60vh,480px);height:auto;object-fit:contain;border-radius:6px}
.st{font-weight:400;white-space:pre-wrap;overflow-wrap:break-word;user-select:none;max-width:100%}
textarea{display:block;width:100%;max-width:100%;min-width:3ch;font:inherit;font-weight:400;line-height:inherit;color:inherit;caret-color:currentColor;background:transparent;border:0;outline:0;padding:0;margin:0;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word}
@supports (field-sizing:content){textarea{field-sizing:content;width:auto}}
textarea::placeholder{color:var(--mute);-webkit-text-fill-color:var(--mute)}
.row.g .st,.row.g textarea{background-image:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;caret-color:var(--cc)}
.row.s .st,.row.s textarea{background-image:var(--base-img);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;caret-color:var(--cc,var(--ink))}
.row.s .st{background-image:linear-gradient(120deg,transparent 35%,var(--sh) 50%,transparent 65%),var(--base-img);background-size:200% 100%,100% 100%;background-repeat:no-repeat;background-position:150% 0,0 0;animation:shine 3.2s linear infinite}
@keyframes shine{0%{background-position:150% 0,0 0}70%,100%{background-position:-50% 0,0 0}}
@media (prefers-reduced-motion:reduce){.row.s .st{animation:none}}
#menu .tx.on{color:var(--ink)}
.tools{display:flex;gap:12px;margin-top:2px;font:300 11px/1 var(--mono);color:var(--mute);opacity:.55;transition:opacity .2s;-webkit-text-fill-color:currentColor}
.row:hover .tools,.tools:focus-within{opacity:1}
.tools button{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:4px 2px;-webkit-text-fill-color:currentColor}
.tools button:hover{color:var(--ink)}
.tools i{font-style:normal;padding:2px 5px;border:1px solid var(--line);border-radius:4px;font-size:10px}
.tools.e button:nth-child(-n+2){opacity:.4}
#hint{position:fixed;left:0;right:0;bottom:0;text-align:center;font:300 11px/1.6 var(--mono);letter-spacing:.02em;color:var(--mute);padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:6}
#blurB{position:fixed;left:0;right:0;bottom:0;height:calc(7rem + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5;isolation:isolate}
#hint b{font-weight:500;color:var(--ink);opacity:.75}
#menu{position:fixed;z-index:9;display:none;flex-direction:column;gap:10px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);font:400 11px/1 var(--mono)}
#menu .mr{display:flex;gap:8px;flex-wrap:wrap;max-width:240px}
#menu button{width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);transition:transform .12s}
#menu .mr button:not(.tx){box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}
#menu button:hover{transform:scale(1.15)}
#menu .gs{width:34px;border-radius:11px}
#menu .f{justify-content:space-between}
#menu .tx{width:auto;height:auto;padding:2px 0;border-radius:0;background:none;color:var(--mute);font:inherit}
#menu .tx:hover{color:var(--ink);transform:none}
#ghost{position:fixed;left:0;top:0;z-index:400;margin-top:-6px;pointer-events:none;white-space:nowrap;font:300 11px/1 var(--mono);letter-spacing:.02em;color:var(--mute);opacity:0;transition:opacity .2s ease;will-change:transform,opacity}
/* ── custom cursor (from nvrvr_styles) ── */
body.custom-cursor-active,body.custom-cursor-active #app,body.custom-cursor-active .row,body.custom-cursor-active header{cursor:none}
.write-cursor-dot,.write-cursor-ellipse{position:fixed;top:0;left:0;z-index:500;pointer-events:none;transform:translate(-9999px,-9999px);opacity:0;transition:opacity .18s ease;will-change:transform}
.write-cursor-dot.visible,.write-cursor-ellipse.visible{opacity:1}
.write-cursor-dot{transition:opacity .18s ease,width .18s ease,height .18s ease,margin .18s ease,border-radius .18s ease}
.write-cursor-dot.text{width:2px;height:var(--dh,24px);margin:calc(var(--dh,24px)/-2) 0 0 -1px;border-radius:1px}
body.custom-cursor-active textarea{cursor:none}
.write-cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink)}
.write-cursor-ellipse{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--ink);border-radius:50%;opacity:0}
.write-cursor-ellipse.visible{opacity:.32}
body.custom-cursor-active.write-native-cursor,body.custom-cursor-active.write-native-cursor #app,body.custom-cursor-active.write-native-cursor .row,body.custom-cursor-active.write-native-cursor header{cursor:auto}
.write-native-cursor .write-cursor-dot,.write-native-cursor .write-cursor-ellipse{opacity:0!important}
</style>
</head>
<body>
<div id="app">
  <header><span class="wm">frankly</span><span><button class="ctl" id="export">export json</button><button class="ctl" id="reset">reset demo</button><button class="ctl" id="theme">dark mode</button></span></header>
  <div id="tree"></div>
</div>
<div id="blurB" aria-hidden="true"></div>
<div id="hint"><span id="ht"></span></div>
<div id="menu"></div>
<div id="ghost" aria-hidden="true">say something new or say something else</div>
<div class="write-cursor-ellipse" id="writeCursorEllipse" aria-hidden="true"></div>
<div class="write-cursor-dot" id="writeCursorDot" aria-hidden="true"></div>
<script>
const $=id=>document.getElementById(id);
const K='digress:v1', PAL=['#e5484d','#f76b15','#e0a800','#30a46c','#0091ff','#8e4ec6','#e93d82'];
const GRAY=['#1b1b1b','#3f3f46','#6b6b73','#8e8e93','#b0b0b6','#d4d4d8','#f2f0ea'];
const G=['#ff5f6d,#ffc371','#0061ff,#22c1c3','#8e2de2,#00c9a7','#ff0080,#7928ca','#11998e,#38ef7d','#f12711,#f5af19','#5227FF,#FF9FFC,#B497CF'].map(s=>`linear-gradient(90deg,${s})`);
const isG=c=>c&&c.startsWith('linear'), first=c=>(c.match(/#[0-9a-f]{3,8}/i)||[c])[0];
let uid=1; const nid=()=>'n'+(uid++);
const mk=(t='')=>({id:nid(),t,c:null,s:false,k:[]});
const seed=()=>([{"t":"Before we start, you should know:","k":[{"t":"this is basically it; the whole idea."},{"t":"suffice to say, I loathe to write as a writer."},{"t":"i prefer to convey as a creative.","k":[{"t":"w/out worrying about APA, MLA, or the fcking Oxford Comma.","k":[{"t":"(look — you weren't bothered by my shorthand, my lack of formatting, and apparent typos, and my complete disregard for posture ;)","c":"#6b6b73"},{"t":"But, you are able to follow, yes?"}]}]}]},{"t":"..."},{"t":"Anyways","k":[{"t":"Here, just write the damn thing.","k":[{"t":"Write it before it escapes your ability to articulate it.","k":[{"t":"Just fcking write the thing.","k":[{"t":"& don't sweat the tpyos because no one is noticing.","k":[{"t":"& if they do, it means you likely wrote it yourself.","k":[{"t":"Also, here is my dog, Wolfgang..."},{"t":"https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/park123.avif"}]}]}]}]}]}]}]);
const fix=a=>a.forEach(n=>{n.id=nid();n.c=n.c||null;n.s=!!n.s;n.k=n.k||[];fix(n.k)});
let root=null; try{root=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!Array.isArray(root)||!root.length) root=seed();
fix(root);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(root))}catch(e){}};
const find=(id,a=root)=>{for(let i=0;i<a.length;i++){if(a[i].id===id)return{n:a[i],a,i};const r=find(id,a[i].k);if(r)return r}return null};
const flat=(a=root,o=[])=>{a.forEach(n=>{o.push(n);flat(n.k,o)});return o};
let editing=null, rendering=false, groups=[];
const HI='<b>click</b> a line to edit &nbsp;·&nbsp; <b>right-click</b> for color &nbsp;·&nbsp; click below to add';
const HE='<b>enter</b> next &nbsp;·&nbsp; <b>shift+enter</b> branch &nbsp;·&nbsp; <b>⌫</b> on empty deletes &nbsp;·&nbsp; <b>esc</b> done';

/* text pressure lives on the chrome only: logo, controls, hints */
function splitNode(root){
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), nodes=[];
  while(tw.nextNode()) if(!tw.currentNode.parentElement.classList.contains('c')) nodes.push(tw.currentNode);
  nodes.forEach(t=>{
    const f=document.createDocumentFragment();
    t.nodeValue.split(/(\s+)/).forEach(w=>{
      if(!w)return;
      if(/^\s+$/.test(w)){f.appendChild(document.createTextNode(w));return}
      const sp=document.createElement('span'); sp.className='w';
      [...w].forEach(ch=>{const c=document.createElement('span');c.className='c';c.textContent=ch;sp.appendChild(c)});
      f.appendChild(sp);
    });
    t.replaceWith(f);
  });
}
function collect(){
  groups=[];
  const add=(el,hi)=>{
    if(!el)return; splitNode(el);
    const c=[...el.querySelectorAll('.c')];
    c.forEach(x=>{x._b=parseInt(getComputedStyle(x).fontWeight)||400;x._t=undefined});
    groups.push({s:el,c,hi});
  };
  add(document.querySelector('.wm'),900); add($('export'),700); add($('reset'),700); add($('theme'),700); add($('ht'),700);
  document.querySelectorAll('.tools').forEach(t=>add(t,700));
}
const IMG=/^(?:https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif|svg|bmp)(?:[?#]\S*)?|https?:\/\/(?:images\.unsplash\.com|i\.imgur\.com|pbs\.twimg\.com|images\.pexels\.com)\/\S+|data:image\/(?:png|jpe?g|gif|webp|avif);base64,[A-Za-z0-9+\/=]+)$/i;
const isImg=t=>IMG.test(t.trim());
const VID=/^(?:https?:\/\/\S+\.(?:mp4|webm|mov|m4v|ogv)(?:[?#]\S*)?|data:video\/(?:mp4|webm|ogg);base64,[A-Za-z0-9+\/=]+)$/i;
const isVid=t=>VID.test(t.trim());
/* videos loop silently like gifs and only play while on screen */
const vio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const p=e.target.play();if(p)p.catch(()=>{})}else e.target.pause()}),{threshold:.1});
const fit=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};

function edit(id){
  const p=editing&&find(editing);
  editing=id;
  if(p&&p.n.id!==id&&!p.n.t.trim()&&!p.n.k.length&&flat().length>1) p.a.splice(p.i,1);
  render(); save();
}
function addPeer(n){ if(!n.t.trim())return; const r=find(n.id),m=mk(); r.a.splice(r.i+1,0,m); edit(m.id) }
function addChild(n){ if(!n.t.trim())return; const m=mk(); n.k.push(m); edit(m.id) }
function remove(id){ const r=find(id); if(!r)return; const f=flat(),to=f[f.indexOf(r.n)-1]; r.a.splice(r.i,1); edit(to?to.id:null) }
function render(){
  if(!root.length) root.push(mk());
  if(editing&&!find(editing)) editing=null;
  rendering=true; vio.disconnect();
  const el=$('tree'); el.innerHTML=''; el.appendChild(build(root,0));
  rendering=false;
  const i=el.querySelector('textarea');
  if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);fit(i)}
  $('ht').innerHTML=editing?HE:HI;
  collect();
  window.dispatchEvent(new Event('cursorsync'));
}
function build(a,d){
  const ul=document.createElement('ul'); ul.className=d?'kids':'top';
  a.forEach(n=>{
    const li=document.createElement('li'), row=document.createElement('div'), ed=n.id===editing;
    row.className='row'+(isG(n.c)?' g':'')+(n.s?' s':'')+(ed?' ed':''); row.dataset.id=n.id;
    row.style.setProperty('--fs',Math.max(18,34-d*5)+'px');
    if(n.c){
      if(isG(n.c)){row.style.setProperty('--grad',n.c);row.style.setProperty('--cc',first(n.c))} else row.style.color=n.c;
      li.style.setProperty('--lc',first(n.c));
    }
    if(n.s){
      const b=n.c||'var(--sb)';
      row.style.setProperty('--base-img',isG(n.c)?n.c:`linear-gradient(${b},${b})`);
      if(n.c&&!isG(n.c))row.style.setProperty('--cc',n.c);
    }
    if(ed){
      const i=document.createElement('textarea'), t=document.createElement('div');
      t.className='tools'+(n.t.trim()?'':' e');
      [['↵','next',()=>addPeer(n)],['⇧↵','branch',()=>addChild(n)],['⌫','delete',()=>remove(n.id)]].forEach(([k,l,f])=>{
        const b=document.createElement('button'); b.type='button'; b.innerHTML=`<i>${k}</i>${l}`; b.onclick=f; t.appendChild(b);
      });
      t.addEventListener('mousedown',e=>e.preventDefault());
      i.rows=1; i.value=n.t; i.spellcheck=false; i.placeholder=d?'digress…':'say something…';
      i.oninput=()=>{ if(/\n/.test(i.value))i.value=i.value.replace(/\n+/g,' '); n.t=i.value; t.classList.toggle('e',!i.value.trim()); fit(i); save() };
      i.onkeydown=e=>key(e,n);
      i.onblur=()=>{if(!rendering&&editing===n.id)edit(null)};
      row.append(i,t);
    }else{
      const txt=()=>{const s=document.createElement('div'); s.className='st'; s.textContent=n.t; return s};
      if(isImg(n.t)||isVid(n.t)){
        /* a statement that is an image or video url renders as the media */
        row.classList.add('im');
        const v=isVid(n.t), im=document.createElement(v?'video':'img');
        im.className='pic';
        if(v){im.muted=true;im.loop=true;im.autoplay=true;im.playsInline=true;im.preload='metadata';im.setAttribute('muted','');im.setAttribute('playsinline','');im.src=n.t.trim();vio.observe(im)}
        else{im.alt='';im.draggable=false;im.loading='lazy';im.referrerPolicy='no-referrer';im.src=n.t.trim()}
        im.onerror=()=>{row.classList.remove('im'); im.replaceWith(txt())};
        row.appendChild(im);
      }else row.appendChild(txt());
    }
    li.appendChild(row); if(n.k.length) li.appendChild(build(n.k,d+1)); ul.appendChild(li);
  });
  return ul;
}
function key(e,n){
  const r=find(n.id), t=e.target;
  if(e.key==='Enter'){ e.preventDefault(); e.shiftKey?addChild(n):addPeer(n) }
  else if(e.key==='Backspace'&&!n.t&&!n.k.length){
    const f=flat(); if(f.length<2)return; e.preventDefault();
    const j=f.indexOf(n), to=f[j-1]||f[j+1]; r.a.splice(r.i,1); edit(to.id);
  }else if((e.key==='ArrowUp'&&t.selectionStart===0)||(e.key==='ArrowDown'&&t.selectionEnd===t.value.length)){
    e.preventDefault(); const f=flat(), x=f[f.indexOf(n)+(e.key==='ArrowUp'?-1:1)]; if(x)edit(x.id);
  }else if(e.key==='Escape') edit(null);
}
$('app').addEventListener('mousedown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.closest('.tools,header'))return;
  e.preventDefault();
  const row=e.target.closest('.row');
  if(row){ if(e.button===0) edit(row.dataset.id); return }
  if(e.button!==0)return;
  const last=root[root.length-1];
  if(last&&!last.t.trim()) edit(last.id); else {const m=mk();root.push(m);edit(m.id)}
});
addEventListener('resize',()=>{const t=document.querySelector('textarea');if(t)fit(t)});

/* color menu: flat + gradient */
const menu=$('menu'); let target=null;
menu.innerHTML=`<div class="mr">${PAL.map(c=>`<button style="--c:${c}" data-c="${c}"></button>`).join('')}</div>`+
 `<div class="mr">${GRAY.map(c=>`<button style="--c:${c}" data-c="${c}"></button>`).join('')}</div>`+
 `<div class="mr">${G.map(g=>`<button class="gs" style="--c:${g}" data-c="${g}"></button>`).join('')}</div>`+
 `<div class="mr f"><button class="tx" data-c="">no color</button><button class="tx" data-act="shine">shiny</button><button class="tx" data-act="rm">remove</button></div>`;
const hide=()=>{menu.style.display='none'};
document.addEventListener('contextmenu',e=>{
  const row=e.target.closest('.row'); if(!row){hide();return}
  e.preventDefault(); target=row.dataset.id; menu.style.display='flex';
  const rr=find(target), sb=menu.querySelector('[data-act=shine]'), on=!!(rr&&rr.n.s);
  sb.classList.toggle('on',on); sb.textContent=on?'shiny ✓':'shiny';
  menu.style.left=Math.max(8,Math.min(e.clientX,innerWidth-menu.offsetWidth-8))+'px';
  menu.style.top=Math.max(8,Math.min(e.clientY,innerHeight-menu.offsetHeight-8))+'px';
});
document.addEventListener('mousedown',e=>{if(!menu.contains(e.target))hide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
addEventListener('scroll',hide,{passive:true});
menu.addEventListener('mousedown',e=>e.preventDefault());
menu.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const r=find(target);
  if(r){ if(b.dataset.act==='rm'){ r.a.splice(r.i,1); if(editing===target)editing=null } else if(b.dataset.act==='shine') r.n.s=!r.n.s; else r.n.c=b.dataset.c||null }
  hide(); render(); save();
});

/* reset demo (two-step) + theme toggle */
const html=document.documentElement; let rt;
const label=(el,t)=>{el.textContent=t;collect()};
/* json export: the current writing, nested, without internal ids */
const clean=a=>a.filter(n=>n.t.trim()||n.k.length).map(n=>{const o={text:n.t};if(n.c)o.color=n.c;if(n.s)o.shiny=true;const k=clean(n.k);if(k.length)o.children=k;return o});
$('export').onclick=function(){
  const txt=JSON.stringify({app:'frankly',version:1,exportedAt:new Date().toISOString(),statements:clean(root)},null,2);
  try{
    const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})), a=document.createElement('a');
    a.href=u;a.download='frankly-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000); label(this,'exported ✓');
  }catch(e){ try{navigator.clipboard.writeText(txt)}catch(_){} label(this,'copied ✓') }
  setTimeout(()=>label(this,'export json'),1800);
};
$('reset').onclick=function(){
  if(this.dataset.arm){clearTimeout(rt);delete this.dataset.arm;root=seed();fix(root);editing=null;render();save();label(this,'reset demo')}
  else{this.dataset.arm=1;label(this,'sure? click again');rt=setTimeout(()=>{delete this.dataset.arm;label(this,'reset demo')},2500)}
};
let th=null; try{th=localStorage.getItem('digress:theme')}catch(e){}
if(th) html.dataset.theme=th;
const isDark=()=>(html.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';
const paint=()=>{$('theme').textContent=isDark()?'light mode':'dark mode'};
$('theme').onclick=()=>{const t=isDark()?'light':'dark';html.dataset.theme=t;try{localStorage.setItem('digress:theme',t)}catch(e){};label($('theme'),isDark()?'light mode':'dark mode')};
paint();

/* pressure loop: only the chrome group under the pointer reacts */
const cur={x:innerWidth/2,y:innerHeight/2}, m={x:cur.x,y:cur.y};
const fine=matchMedia('(hover:hover) and (pointer:fine)'), ghost=$('ghost'); let moved=false,blocked=true,gOp=-1;
addEventListener('mousemove',e=>{cur.x=e.clientX;cur.y=e.clientY;moved=true;blocked=!!(e.target.closest&&e.target.closest('.row,.tools,header,#menu'))});
document.addEventListener('mouseleave',()=>{moved=false});
addEventListener('touchmove',e=>{const t=e.touches[0];cur.x=t.clientX;cur.y=t.clientY},{passive:true});
(function loop(){
  m.x+=(cur.x-m.x)/12; m.y+=(cur.y-m.y)/12;
  /* ghost hint: only lives in the band of empty space just below the last statement */
  let go=0;
  if(moved&&!blocked&&fine.matches){
    /* a soft band just below the last statement: fades in, peaks, fades out again */
    const tr=$('tree').getBoundingClientRect(), d=cur.y-tr.bottom;
    const ss=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
    const dx=Math.max(tr.left-cur.x,cur.x-tr.right,0);
    go=ss((d-6)/44)*(1-ss((d-90)/90))*(1-ss(dx/80));
  }
  go=Math.round(go*100)/100;
  if(go!==gOp){gOp=go;ghost.style.opacity=go}
  if(go>0){
    const w=ghost.offsetWidth; let x=cur.x+28; if(x+w>innerWidth-12)x=cur.x-28-w;
    ghost.style.transform='translate('+Math.round(x)+'px,'+Math.round(cur.y)+'px)';
  }
  for(const g of groups){
    const sr=g.s.getBoundingClientRect();
    if(!sr.width)continue;
    const on=cur.y>=sr.top-8&&cur.y<=sr.bottom+8&&cur.x>=sr.left-60&&cur.x<=sr.right+60;
    const maxD=Math.max(70,Math.min(sr.width/2,200));
    for(const c of g.c){
      let tg=0;
      if(on){
        const r=c.getBoundingClientRect();
        tg=Math.max(0,1-Math.hypot(m.x-(r.x+r.width/2),m.y-(r.y+r.height/2))/maxD);
        tg=tg*tg*(3-2*tg);
      }
      const p=c._t===undefined?-1:c._t;
      if(p===tg)continue;
      const n=p<0?tg:(Math.abs(tg-p)<.004?tg:p+(tg-p)*.18);
      c._t=n; c.style.fontWeight=Math.round(c._b+(g.hi-c._b)*n);
    }
  }
  requestAnimationFrame(loop);
})();
/* ── custom cursor (from nvrvr_styles) ── */
(function initWriteCursor(){
  const dot=document.getElementById('writeCursorDot'), ellipse=document.getElementById('writeCursorEllipse');
  if(!dot||!ellipse)return;
  const NATIVE_SELECTOR=['button','a','input','select','[role="button"]','.letter-hotspot'].join(', ');
  let lastTx=null,ptrX=0,ptrY=0,prevFrameX=0,prevFrameY=0,frameInit=false,ellAngle=0,ellScaleX=1,ellScaleY=1,rafId=null;
  const ELLIPSE_LERP=0.22,SPEED_SATURATE=34,MAX_STRETCH=0.6;
  const shortAngleLerp=(current,target,factor)=>{const diff=((target-current+540)%360)-180;return current+diff*factor};
  function step(){
    if(!frameInit){prevFrameX=ptrX;prevFrameY=ptrY;frameInit=true}
    const dx=ptrX-prevFrameX,dy=ptrY-prevFrameY;
    prevFrameX=ptrX;prevFrameY=ptrY;
    const speed=Math.hypot(dx,dy);
    const angleTarget=speed>0.4?Math.atan2(dy,dx)*(180/Math.PI):ellAngle;
    const stretch=Math.min(speed/SPEED_SATURATE,1)*MAX_STRETCH;
    ellAngle=shortAngleLerp(ellAngle,angleTarget,ELLIPSE_LERP);
    ellScaleX+=(1+stretch-ellScaleX)*ELLIPSE_LERP;
    ellScaleY+=(1-stretch*0.45-ellScaleY)*ELLIPSE_LERP;
    ellipse.style.transform='translate('+ptrX+'px,'+ptrY+'px) rotate('+ellAngle+'deg) scale('+ellScaleX+','+ellScaleY+')';
    rafId=requestAnimationFrame(step);
  }
  const startLoop=()=>{if(!rafId)rafId=requestAnimationFrame(step)};
  const stopLoop=()=>{if(rafId){cancelAnimationFrame(rafId);rafId=null}};
  function hideAll(){
    dot.classList.remove('visible');ellipse.classList.remove('visible');
    document.body.classList.remove('write-native-cursor','custom-cursor-active');
    stopLoop();
  }
  /* line cursor over set statements only; while a field is in focus it stays a normal dot */
  function setText(el){
    const tx=(!document.querySelector('textarea')&&el&&el.nodeType===1)?el.closest('.st'):null;
    if(tx!==lastTx){lastTx=tx;dot.classList.toggle('text',!!tx);if(tx)dot.style.setProperty('--dh',Math.round(parseFloat(getComputedStyle(tx).fontSize)*1.15)+'px')}
  }
  window.addEventListener('cursorsync',()=>setText(document.elementFromPoint(ptrX,ptrY)));
  window.addEventListener('mousemove',e=>{
    const overNative=!!(e.target&&e.target.nodeType===1&&e.target.closest(NATIVE_SELECTOR));
    document.body.classList.add('custom-cursor-active');
    document.body.classList.toggle('write-native-cursor',overNative);
    setText(e.target);
    ptrX=e.clientX;ptrY=e.clientY;
    dot.style.transform='translate('+ptrX+'px,'+ptrY+'px)';
    dot.classList.add('visible');ellipse.classList.add('visible');
    startLoop();
  });
  document.addEventListener('mouseleave',hideAll);
})();
/* progressive blur at the bottom edge (GradualBlur: bezier curve, exponential, 5 layers) */
(function gradualBlur(){
  const box=$('blurB'), N=5, S=2, inc=100/N, r=x=>Math.round(x*10)/10;
  for(let i=1;i<=N;i++){
    let p=i/N; p=p*p*(3-2*p);
    const bv=(Math.pow(2,p*4)*0.0625*S).toFixed(3);
    let g=`transparent ${r(inc*i-inc)}%, black ${r(inc*i)}%`;
    if(r(inc*i+inc)<=100)g+=`, black ${r(inc*i+inc)}%`;
    if(r(inc*i+inc*2)<=100)g+=`, transparent ${r(inc*i+inc*2)}%`;
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;inset:0;-webkit-mask-image:linear-gradient(to bottom,${g});mask-image:linear-gradient(to bottom,${g});-webkit-backdrop-filter:blur(${bv}rem);backdrop-filter:blur(${bv}rem)`;
    box.appendChild(d);
  }
})();
render();
</script>
