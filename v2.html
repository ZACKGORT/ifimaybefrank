                {

                  "children": [
                    {
                      "text": "Pratt Institute of Art was expensive, and loans or financial aid were simply out of reach {though not as simple as it may seem}.",

                      "shiny": false,
                      "collapsed": true,
                      "children": [
                        {
                          "text": "At nineteen years old, there wasn't much that I could afford, so I worked in construction and demolition, at the bowling alley, the hardware store, the grocery store, and at the gas station.",

                          "collapsed": false,

                            {
                              "text": "At this point, I was already in my twenties, without a degree and with zero applicable skills beyond what I could [\"bull\"-expletive] with my so-called 'talent'.",

                    {
                      "text": "3.8 GPA (unweighted); all honors & advanced placement; varsity athlete",
                      "color": null,
                      "shiny": false,
                      "collapsed": true,
                      "children": [
                        {
                          "text": "I applied to only two schools my senior year, circa 2001-2002.",

                          "children": [
                            {
                              "text": "1. Carnegie Melon",

                            },
                            {
                              "text": "2. Pratt Institute",
                              "color": null,
                              "shiny": false,
                              "collapsed": false,
                              "children": [
                                {
                                  "text": "I was accepted into both.",
                                  "color": null,
                                  "shiny": false,
                                  "collapsed": false,
                                  "children": [
                                    {
                                      "text": "Carnegie didn't offer any scholarship.",

                                      "shiny": false,

                                    },
                                    {
                                      "text": "Pratt offered $8K/year.",
                                      "color": null,
                                      "shiny": false,
                                      "collapsed": false
                                    },
                                    {
                                      "text": "Tuition was comparable at ~$40k/year.",
                                      "color": null,
                                      "shiny": false,
                                      "collapsed": false
                                    },
                                    {
                                      "text": "Truth is, I come from a hyper conservative family. I had zero say in the financials of my future.",
                                      "color": null,
                                      "shiny": false,
                                      "collapsed": true,
                                      "children": [
                                        {
                                          "text": "The moment my parents saw a savings of \"nearly ten thousand dollars per year\" ($8K scholarship apparently rounds up to $10K in their minds), they completely took Carnegie Melon University off of the table.",
                                          "color": null,
                                          "shiny": false,
                                          "collapsed": false,
                                          "children": [
                                            {
                                              "text": "Had a disagreement about the contract I signed with my parents for them to fund my tuition; so they cancelled my tuition and bought my little sister a $65K show horse. ",
                                              "color": null,
                                              "shiny": false,
                                              "collapsed": false,
                                              "children": [
                                                {
                                                  "text": "The army wouldn't take me on account of my medical history, which at that time included a combination titanium plates and steel screws holding three parts of my skeleton together (besides near sightedness, colorblindness, and astigmatisms in both eyes, disqualifying me from active service).",
                                                  "color": null,
                                                  "shiny": false,
                                                  "collapsed": false,

                    {
                      "text": "It's a bit complicated, but I failed my 'Light, Color, & Design' class, as well as my Observational Illustration class; the former due to undiagnosed color-blindness, and the latter because I drew the tampon string dangling from the live nude model and was ejected from the class immediately upon reviewing my piece on the critique wall.",

                      "shiny": false,
                      "collapsed": false,
