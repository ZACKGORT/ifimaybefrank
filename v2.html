/* zoom: log-scaled range, gentler wheel, slosh gauge (vanilla port of react-bits SloshGauge) */
const ZMIN=.12,ZMAX=2.5,LR=Math.log(ZMAX/ZMIN),s2v=s=>100*Math.log(clamp(s,ZMIN,ZMAX)/ZMIN)/LR,v2s=v=>ZMIN*Math.exp(clamp(v,0,100)/100*LR);
const zg=$('zg');zg.insertAdjacentHTML('beforeend','<span class="zv"></span><div class="zl"><span class="zv"></span></div><div class="zt"></div><div class="zo"></div><div class="zm"></div>');

function zpaint(){const W=zg.clientWidth,Hh=zg.clientHeight,th=RM.matches?0:clamp(.45*Z.v*.07,-30,30),lean=Math.tan(th*Math.PI/180)*W/2,top=100-Z.x;
zl.style.clipPath=`polygon(0 calc(${top}% + ${lean}px),100% calc(${top}% - ${lean}px),100% 100%,0 100%)`;zm.style.transform=`translateY(${(100-Z.L)*Hh/100}px)`}
function ztick(now){const dt=Z.last?Math.min((now-Z.last)/1000,.05):1/120;Z.last=now;
const vis=.15,k=1224-1044*vis,zeta=RM.matches?1:.26-.17*vis,c=2*zeta*Math.sqrt(k),rest=RM.matches?0:.42;
for(let n=Math.ceil(dt*120),hh=dt/n;n>0;n--){Z.v=Z.v*Math.exp(-c*hh)+k*(Z.L-Z.x)*hh;Z.x+=Z.v*hh;if(Z.x>100){Z.x=100;Z.v=-Z.v*rest}else if(Z.x<0){Z.x=0;Z.v=-Z.v*rest}}
if(!Z.held&&Math.abs(Z.L-Z.x)<.05&&Math.abs(Z.v)<2){Z.x=Z.L;Z.v=0}
zpaint();if(!Z.held&&Z.x===Z.L&&Z.v===0){Z.raf=0;Z.last=0}else Z.raf=requestAnimationFrame(ztick)}
const zwake=()=>{if(!Z.raf)Z.raf=requestAnimationFrame(ztick)};

if(Z.held)return;const L=s2v(cam.s);if(Math.abs(L-Z.L)>.01){Z.L=L;zwake()}}
